# Keeps the actions referenced by the workflows and by action.yml current.
# Without this, pinning a digest would quietly freeze a dependency instead of
# controlling it.
version: 2

updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows/ and the composite action.yml at the root.
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
